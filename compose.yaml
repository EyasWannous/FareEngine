services:
  fareengine.api:
    image: fareengine.api
    build:
      context: .
      dockerfile: src/FareEngine.API/Dockerfile

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: fareengine-sqlserver
    environment:
      SA_PASSWORD: "FareEngine_2025!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "FareEngine_2025!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data: